# Global settings. Scoring weights are tuned later by the Learner.

scoring:
  windowSec: 5
  topN: 10
  leadInSec: [30, 60] # chat reacts after the moment, so start this much before the peak
  tailSec: 8 # download this much after the peak window; the editor trims to the end of the reaction sentence
  weights:
    chatRate: 1.0
    emoteScore: 0.15 # eval 2026-11-24 (1 VOD, top-20 viewer clips): 0.8 hit 3/20, 0.15 hit 7/20, chat-only 8/20; emote spam drowns chat rate
    viewerClipHits: 2.0
    audioPeak: 0.5
  emotes:
    LUL: 1.0
    KEKW: 1.0
    OMEGALUL: 1.2
    Pog: 1.0
    PogChamp: 1.0

clip:
  minSec: 10
  maxSec: 60
  targetSec: [12, 26] # study 2026-11-24 (119 Twitch top clips): <20s beat the streamer median 54% vs ~33% for longer; Shorts median 23s; campaign maxSec still caps it. Editor trims to this length: start at a sentence before the build-up, end after the reaction
  disclosure: true # default on; campaigns can override
  disclosureText: "#ad"
  disclosureSec: 3
  disclosureInVideo: false # a campaign can set disclosureInVideo: true if its brief demands it
  disclosureInText: false # owner 2026-11-24: no #ad in captions or video; disclosure = platform paid-promotion toggle
  captionStyle: bold # bold | pop | clean; streamers.yaml can override per streamer
  censor: # caption masking (audio untouched); applied to every clip while any listed platform is on
    platforms: [tiktok]
    words: [fuck, shit, bitch, cunt, nigg, fag, retard]

judge:
  # Local LLM rates each clip (talk + 4 frames). GPU only when nobody touched mouse/keyboard for awayMin, else CPU.
  # Its scores only count once the weekly learner proves they predict good clips (data/learned.json).
  awayMin: 10

review:
  # Keep a clip without asking when people (not loudness) say it is good: several viewers clipped it AND chat reacted.
  # Any compliance warning still goes to manual review. First guess 2026-11-24 (3 of 25 pending clips pass); tune with real views.
  autoKeep:
    enabled: true
    minViewerClips: 5
    minChatRate: 1.0 # chat z-score vs the stream's baseline

limits:
  maxPostsPerAccountPerDay: 3
  # Content Rewards pauses submissions when too many are still unapproved (Terms 7.14); posts pending over 7 days get reviewed (7.2).
  maxPostsPerAccountPerWeek: 10

platforms:
  tiktok: false
  youtube: false
  instagram: false

publish:
  tiktokPublic: false # true once TikTok approved the app; until then posts are private (only you see them)

titles:
  model: gemma4:12b # local Ollama; picked over qwen3.5:9b on 10 real clips (fewer made-up facts)

retention:
  keepSourceDays: 2 # delete source VODs this long after clips are done

queue:
  maxAttempts: 3

watcher:
  enabled: true # owner 2026-11-24: everything automatic
  pollMinutes: 15
  maxVodAgeDays: 3 # ignore older VODs when a streamer is first added

# npm run study: extra Twitch channels to learn from (analysis only, never clipped or posted: no campaign).
study:
  extra: [kaicenat, jynxzi, caseoh_, xqc, plaqueboymax, stableronaldo, lacy, zackrawrr, fanum, tarik]
